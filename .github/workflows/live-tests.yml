# Run the live test suite against the Creem sandbox (test-api.creem.io).
#
# Triggered on every push to main, on version tags, and manually.
# Requires the CREEM_API_KEY repository secret (a TEST key — safe to store;
# it only talks to the sandbox). The job is skipped when the secret is not
# configured.
#
# Setup: Settings -> Secrets and variables -> Actions -> New repository
# secret: name CREEM_API_KEY, value your creem_test_... key.

name: Live tests

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    if: secrets.CREEM_API_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Write sandbox key to .env
        run: echo "CREEM_API_KEY=${{ secrets.CREEM_API_KEY }}" > .env
      - name: Run live tests against the sandbox
        run: pytest -m live
