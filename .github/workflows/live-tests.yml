# Run the live test suite against the Creem sandbox (test-api.creem.io).
#
# Triggered on every push to main, on version tags, and manually.
# Requires the CREEM_API_KEY repository secret (a TEST key — safe to store;
# it only talks to the sandbox). The test step is skipped when the secret is
# not configured, so the workflow stays green on forks.
#
# Setup: Settings -> Secrets and variables -> Actions -> New repository
# secret: name CREEM_API_KEY, value your creem_test_... key.

name: Live tests

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Prepare sandbox key
        id: key
        env:
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
        run: |
          if [ -n "$CREEM_API_KEY" ]; then
            echo "CREEM_API_KEY=$CREEM_API_KEY" > .env
            echo "configured=1" >> "$GITHUB_OUTPUT"
          else
            echo "configured=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Run live tests against the sandbox
        if: steps.key.outputs.configured == '1'
        run: pytest -m live
