# Publish the creem SDK.
#
# A version tag (v0.1.0, ...) or a manual workflow_dispatch run:
#   quality          - lint (flake8, pylint), type check (mypy), pytest,
#                      build sdist + wheel; runs on Python 3.11 and 3.13
#   publish-testpypi - upload to Test PyPI (test.pypi.org)
#   publish-pypi     - upload to PyPI (pypi.org)
#
# Uses Trusted Publishing (OIDC): no API tokens stored in the repo.
# One-time setup per index: create the `creem` project on the index, then
# Publishing -> "Add a new pending publisher":
#   PyPI project: creem
#   Publisher: GitHub
#   Owner: AJ-Gonzalez
#   Repository: creem-python
#   Workflow: publish.yml
#   Environment: (leave empty)
# Register the pending publisher on BOTH test.pypi.org and pypi.org.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          INIT_VERSION="$(sed -n 's/__version__ = "\(.*\)"/\1/p' src/creem/__init__.py)"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ] || [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match pyproject ($PYPROJECT_VERSION) or __init__ ($INIT_VERSION)"
            exit 1
          fi
          echo "tag v$TAG_VERSION matches pyproject and __init__"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (flake8)
        run: flake8 src tests scripts
      - name: Lint (pylint)
        run: pylint src tests scripts examples
      - name: Type check
        run: mypy
      - name: Run tests
        run: pytest
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist

  publish-testpypi:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing: mint an OIDC token for PyPI
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-3.13
          path: dist
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing: mint an OIDC token for PyPI
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-3.13
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release-github:
    needs: quality
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - name: Compute release title and body from the changelog
        id: release
        run: |
          HEADING="$(grep '^## \[' CHANGELOG.md | grep -v '^## \[Unreleased\]' | head -1)"
          VERSION="$(echo "$HEADING" | sed -n 's/^## \[\([0-9.]*\)\].*/\1/p')"
          NICKNAME="$(echo "$HEADING" | sed -n 's/.*— "\(.*\)".*/\1/p')"
          if [ -n "$NICKNAME" ]; then
            TITLE="v$VERSION — $NICKNAME"
          else
            TITLE="v$VERSION"
          fi
          BODY="$(awk 'BEGIN { n = 0 } /^## \[Unreleased\]/ { next } /^## \[/ { n++; if (n == 1) { next } } n == 1 { print } n > 1 { exit }' CHANGELOG.md)"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.title }}
          body: ${{ steps.release.outputs.body }}
          generate_release_notes: false
