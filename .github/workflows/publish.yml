# Publish the creem SDK.
#
# A version tag (v0.1.0, ...) or a manual workflow_dispatch run:
#   quality          - mypy, pytest, build sdist + wheel
#   publish-testpypi - upload to Test PyPI (test.pypi.org)
#   publish-pypi     - upload to PyPI (pypi.org)
#
# Uses Trusted Publishing (OIDC): no API tokens stored in the repo.
# One-time setup per index: create the `creem` project on the index, then
# Publishing -> "Add a new pending publisher":
#   PyPI project: creem
#   Publisher: GitHub
#   Owner: AJ-Gonzalez
#   Repository: creem-python
#   Workflow: publish.yml
#   Environment: (leave empty)
# Register the pending publisher on BOTH test.pypi.org and pypi.org.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Type check
        run: mypy
      - name: Run tests
        run: pytest
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish-testpypi:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing: mint an OIDC token for PyPI
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing: mint an OIDC token for PyPI
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
