[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creem"
version = "0.4.0"
description = "Python SDK for the Creem.io REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AJ Gonzalez", email = "aj.gonzalez.dev@gmail.com" }]
keywords = ["creem", "payments", "merchant-of-record", "subscriptions", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "pylint>=3.2",
    "flake8>=7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.45",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/AJ-Gonzalez/creem-python"
Source = "https://github.com/AJ-Gonzalez/creem-python"
Issues = "https://github.com/AJ-Gonzalez/creem-python/issues"
Documentation = "https://docs.creem.io/api-reference"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: hits the real test-api.creem.io sandbox (requires CREEM_API_KEY; run with -m live)",
]


[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.pylint.main]
ignore = ["models.py"]
max-args = 8
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-statements",
    "duplicate-code",
    "redefined-builtin",
    "redefined-outer-name",
    "fixme",
    "import-outside-toplevel",
    "wrong-import-position",
    "unused-argument",
    "invalid-name",
    "broad-exception-caught",
    "missing-timeout",
    "too-many-positional-arguments",
]
